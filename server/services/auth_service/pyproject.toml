[project]
name = "auth-service"
version = "0.1.0"
description = "Auth service for LearnioX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "learniox-common"
]

[tool.uv.sources]
learniox-common = { workspace = true }
