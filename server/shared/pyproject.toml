[project]
name = "learniox-common"
version = "0.1.0"
description = "Shared models, schemas, and helpers for LearnioX microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
