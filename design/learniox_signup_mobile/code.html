<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-sm antialiased">
<!-- Top Navigation Placeholder (Suppressed for Transactional Page) -->
<!-- Content Canvas -->
<main class="w-full max-w-[400px] px-margin-mobile flex flex-col gap-xl">
<!-- Header -->
<header class="flex flex-col items-center gap-lg">
<img alt="LearnioX Logo" class="h-[40px] w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujz4qsi_j8Rh1ZkfgMQMjZ8Iw-RaHM6cHYI3hyF8Ccd82G4Kjnfq0livPftLk7xPssp1K8-FObPWN22rQLw-N37g6TB_YOYePSDpXiLzmoUpR9jdettkjX-32xwqKwMMJojTSmkKsWdbZWxcfWudQL8NPL_MICH8ayVu4EyPbya-cTBm5HO-HIXAsoFNKtKCrqTEnvJqbtd1SJUSN_KbVFscpSzQE7rOgARAyQk9AcuTYAWZtwQaeJRwMY"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center">Create account</h1>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-lg w-full">
<!-- Inputs Group -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-background" for="fullName">Full name</label>
<input class="w-full border border-[#CCCCCC] bg-surface-container-lowest p-sm font-body-md text-body-md text-on-background focus:border-primary focus:ring-0 focus:outline-none placeholder:text-secondary h-12 transition-colors duration-200" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-background" for="email">Email</label>
<input class="w-full border border-[#CCCCCC] bg-surface-container-lowest p-sm font-body-md text-body-md text-on-background focus:border-primary focus:ring-0 focus:outline-none placeholder:text-secondary h-12 transition-colors duration-200" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-background" for="password">Password</label>
<input class="w-full border border-[#CCCCCC] bg-surface-container-lowest p-sm font-body-md text-body-md text-on-background focus:border-primary focus:ring-0 focus:outline-none placeholder:text-secondary h-12 transition-colors duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<input class="appearance-none w-4 h-4 border border-primary bg-surface-container-lowest checked:bg-primary checked:border-primary shrink-0 mt-1 cursor-pointer transition-colors duration-200" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-background cursor-pointer select-none" for="terms">
                    I agree to the Terms and Privacy Policy
                </label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md mt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md h-12 flex items-center justify-center hover:bg-[#666666] transition-colors duration-200" type="submit">
                    Create account
                </button>
<button class="w-full bg-surface-container-lowest text-primary border border-primary font-label-md text-label-md py-md h-12 flex items-center justify-center gap-sm hover:border-[2px] transition-all duration-200" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</div>
</form>
<!-- Footer Link -->
<div class="text-center mt-md">
<a class="font-body-sm text-body-sm text-primary hover:underline underline-offset-4 decoration-primary transition-all duration-200" href="#">
                Already have an account? Log in
            </a>
</div>
</main>
<style>
        /* Custom Checkbox Checkmark (since it's a solid block per style guide) */
        input[type="checkbox"]:checked {
            background-image: none; /* Remove default checkmark if any */
        }
    </style>
