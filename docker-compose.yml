services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: learniox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learniox}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - learniox-network

  # 2. Redis Cache & Gateway Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: learniox-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - learniox-network

  # 3. Main Backend — FastAPI Server Service
  server-service:
    build:
      context: ./apps/server-service
      dockerfile: Dockerfile
    container_name: learniox-server-service
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/server-service:/app
      - uploads_data:/app/uploads
    networks:
      - learniox-network

  # 4. BFF API Gateway Service (Python FastAPI)
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: learniox-api-gateway
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - server-service
      - redis
    networks:
      - learniox-network

  # 5. Nginx Ingress Reverse Proxy
  nginx:
    build:
      context: ./apps/nginx
      dockerfile: Dockerfile
    container_name: learniox-nginx-ingress
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    volumes:
      - uploads_data:/app/uploads:ro
    networks:
      - learniox-network

  # 6. Frontend Client Service (Next.js)
  client-service:
    build:
      context: ./apps/client-service
      dockerfile: Dockerfile
    container_name: learniox-client-service
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - learniox-network

  # 7. Ngrok Public Tunneling Service
  # Exposes Nginx Reverse Proxy (Port 80) securely to the public internet
  ngrok:
    image: ngrok/ngrok:latest
    container_name: learniox-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "nginx:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - learniox-network

networks:
  learniox-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
