proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=NEXT_CACHE:10m inactive=60m max_size=256m use_temp_path=off;

upstream api_gateway_upstream {
    server api-gateway:8080 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

upstream live_service_upstream {
    server live-service:8003 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

upstream client_service_upstream {
    server client-service:3000 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name localhost _;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ingress Health Check
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"nginx-ingress"}';
    }

    # Static File Uploads Serving
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Live Classroom WebSockets routed directly to live-service
    location /api/v1/live/ws/ {
        proxy_pass http://live_service_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All API Traffic routed through BFF API Gateway
    location /api/ {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        # Header propagation for client IP & proxy tracking
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://client_service_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend Client Service (Next.js)
    location / {
        proxy_pass http://client_service_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Microcache public GET pages
        proxy_cache NEXT_CACHE;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 304 302 301 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Error handling pages
    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
